name: taller-docker-nginx

services:
  api:
    build: .
    image: backend-api
    environment:
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
  redis:
    image: redis:7-alpine
    networks:
      - backend

networks:
  backend:
    driver: bridge
